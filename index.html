/* Layout: one phone-width column. A lilac stage holds the coin mascot and the day's sum; cards below; fixed tab bar at the bottom. */
:root{
  --bg:#F5F3FF; --surface:#FFFFFF; --field:#FAF9FF; --stage:#E4DDFF;
  --ink:#1E1A3C; --muted:#5F5B87; --line:#E0DBF4;
  --accent:#5B3FD6; --on-accent:#FFFFFF; --accent-soft:#E9E4FF;
  --gold:#F5B72E; --gold-hi:#FFD976; --gold-lo:#B97F08;
  --mint:#0F9B79; --mint-soft:#D8F5EB; --coral:#D9442F; --coral-soft:#FFE3DD;
  --font-display:'Unbounded','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14112A; --surface:#201C40; --field:#181433; --stage:#2B2557;
    --ink:#F2EFFF; --muted:#ACA7D2; --line:#352F63;
    --accent:#7B63F5; --on-accent:#FFFFFF; --accent-soft:#332C6B;
    --gold:#FFC83D; --gold-hi:#FFE08F; --gold-lo:#D79A12;
    --mint:#3DDBB5; --mint-soft:#17413B; --coral:#FF8A78; --coral-soft:#4A2630;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14112A; --surface:#201C40; --field:#181433; --stage:#2B2557;
  --ink:#F2EFFF; --muted:#ACA7D2; --line:#352F63;
  --accent:#7B63F5; --on-accent:#FFFFFF; --accent-soft:#332C6B;
  --gold:#FFC83D; --gold-hi:#FFE08F; --gold-lo:#D79A12;
  --mint:#3DDBB5; --mint-soft:#17413B; --coral:#FF8A78; --coral-soft:#4A2630;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 104px;
}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h1{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.01em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px;padding:4px 10px;border-radius:99px}
.chip.alt{background:var(--mint-soft);color:var(--mint)}
:root[data-theme="dark"] .chip{color:#C9BEFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip{color:#C9BEFF}}

.stage{background:var(--stage);border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:14px}
.mascot-row{display:flex;gap:12px;align-items:flex-end}
.m{width:124px;flex:none}
.m svg{display:block;width:100%;height:auto;overflow:visible}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface);border-radius:20px;padding:12px 14px;font-weight:700;font-size:15px;line-height:1.35;margin-bottom:34px}
.bubble::before{content:"";position:absolute;left:-8px;bottom:18px;width:16px;height:16px;background:var(--surface);transform:rotate(45deg);border-radius:3px}
.sumblock{display:flex;flex-direction:column;gap:8px}
.label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.amount{font-family:var(--font-display);font-weight:700;font-size:clamp(32px,10vw,46px);line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bar{height:14px;border-radius:99px;background:var(--surface);overflow:hidden}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-hi));transition:width .5s ease}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--font-display);font-weight:500;font-size:16px}
.card p{color:var(--muted)}
.notice{background:var(--coral-soft);color:var(--ink);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.notice p{font-weight:700}
.done-card{background:var(--mint-soft);border-color:transparent}
.done-card h2{color:var(--mint)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:800;cursor:pointer;text-align:center}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
:root[data-theme="dark"] .btn.ghost{color:#D6CCFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{color:#D6CCFF}}
.btn.small{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px;align-self:flex-start}
.btn.block{width:100%;min-height:54px;font-size:17px}
.btn.danger{background:var(--coral);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.legend{font-weight:800;font-size:14px}
input[type=text],input[type=number],textarea,select{width:100%;min-width:0;background:var(--field);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-height:46px}
textarea{resize:vertical;min-height:88px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
.inline{display:flex;gap:8px;align-items:stretch}
.inline>input{flex:1}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:6px}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.mood-opt{position:relative}
.mood-opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.mood-opt span{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:68px;padding:8px 6px;border-radius:14px;border:2px solid var(--line);background:var(--field);font-size:12px;font-weight:700;color:var(--muted)}
.mood-opt b{font-size:22px;line-height:1}
.mood-opt input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.mood-opt input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:14px;overflow:hidden;background:var(--field);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(20,17,42,.75);color:#fff;border:0;font-weight:800;line-height:1;cursor:pointer}
.chips-l{display:flex;gap:6px;flex-wrap:wrap}
.lchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:99px;padding:4px 6px 4px 12px;font-size:13px;font-weight:700;max-width:100%}
.lchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lchip button{border:0;background:var(--surface);color:var(--ink);width:22px;height:22px;border-radius:50%;font-weight:800;line-height:1;cursor:pointer;flex:none}
.err{color:var(--coral);font-weight:700;font-size:14px;min-height:0}

.entry{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.entry:first-of-type{border-top:0;padding-top:0}
.entry-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.entry h3{font-size:16px;font-weight:800;overflow-wrap:anywhere;min-width:0}
.price{font-family:var(--font-display);font-weight:500;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mood{font-size:14px;font-weight:700;color:var(--muted)}
.desc{color:var(--ink)!important;white-space:pre-wrap;overflow-wrap:anywhere}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.links a{color:var(--accent);font-weight:700;overflow-wrap:anywhere}
:root[data-theme="dark"] .links a{color:#C9BEFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .links a{color:#C9BEFF}}

.day-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.day-head h2{text-transform:capitalize}
.pill{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--muted)}
.pill.ok{background:var(--mint-soft);color:var(--mint)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-family:var(--font-display);font-weight:700;font-size:15px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;font-weight:700;color:var(--muted)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head h2{text-transform:capitalize}
.cal-nav{width:40px;height:40px;border-radius:12px;border:0;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:18px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:12px;font-weight:800;color:var(--muted);text-align:center;padding-bottom:2px;text-transform:capitalize}
.cell{position:relative;aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:var(--field);font-variant-numeric:tabular-nums}
.cell.c-done{background:var(--gold);color:#2A1F00}
.cell.c-missed{background:var(--coral-soft);color:var(--coral)}
.cell.c-today{outline:3px solid var(--accent);outline-offset:-1px}
.cell.c-ceil::after{content:"";position:absolute;bottom:4px;width:6px;height:6px;border-radius:50%;background:var(--mint)}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--muted)}
.legend-row i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.runs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.runs li{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.runs li:first-child{border-top:0}
.runs span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.pre{width:100%;min-height:120px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 2px;border-radius:14px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;min-width:0}
#nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
:root[data-theme="dark"] #nav button[aria-current="page"]{color:#D6CCFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #nav button[aria-current="page"]{color:#D6CCFF}}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:25}
#fx i{position:absolute;left:50%;top:32%;width:10px;height:14px;border-radius:3px;animation:fly 1.5s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
#lightbox{position:fixed;inset:0;z-index:40;background:rgba(10,8,25,.88);display:flex;align-items:center;justify-content:center;padding:20px}
#lightbox img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain}
#lightbox button{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#1E1A3C;font-size:22px;font-weight:800;cursor:pointer}

/* mascot: face and outfit follow data-state and data-tier */
.m .mo-happy,.m .mo-sad,.m .mo-sleepy,.m .eyes-closed,.m .brows,.m .sparks,.m .zz,.m .acc-bow,.m .acc-hat,.m .acc-crown{display:none}
.m[data-state="happy"] .mo-idle,.m[data-state="party"] .mo-idle,.m[data-state="sad"] .mo-idle,.m[data-state="sleepy"] .mo-idle{display:none}
.m[data-state="happy"] .mo-happy,.m[data-state="party"] .mo-happy{display:inline}
.m[data-state="sad"] .mo-sad,.m[data-state="sad"] .brows{display:inline}
.m[data-state="sleepy"] .mo-sleepy,.m[data-state="sleepy"] .eyes-closed,.m[data-state="sleepy"] .zz{display:inline}
.m[data-state="sleepy"] .eyes-open{display:none}
.m[data-state="happy"] .sparks,.m[data-state="party"] .sparks{display:inline}
.m[data-tier="1"] .acc-bow,.m[data-tier="2"] .acc-bow,.m[data-tier="3"] .acc-bow{display:inline}
.m[data-tier="2"] .acc-hat{display:inline}
.m[data-tier="3"] .acc-crown{display:inline}
.m .coin{transform-origin:80px 144px;animation:bob 3.2s ease-in-out infinite}
.m .eyes-open{transform-origin:80px 72px;animation:blink 4.5s infinite}
.m[data-state="happy"] .coin{animation:jump .7s ease-out 2}
.m[data-state="party"] .coin{animation:wiggle .6s ease-in-out infinite}
.m[data-state="sad"] .coin{animation:droop 3.6s ease-in-out infinite}
.m[data-state="sleepy"] .coin{animation:bob 5s ease-in-out infinite}
.m .sparks path{animation:twinkle 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.m .sparks path:nth-child(2){animation-delay:.3s}
.m .sparks path:nth-child(3){animation-delay:.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes jump{0%{transform:translateY(0) scale(1.05,.92)}40%{transform:translateY(-22px) scale(.96,1.05)}100%{transform:translateY(0) scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-6px)}}
@keyframes droop{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(2px)}}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.15);opacity:1}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s);}
function pad(n){return n<10?'0'+n:''+n;}
function parts(s){var p=s.split('-');return [+p[0],+p[1],+p[2]];}
function toStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function localDate(){return toStr(new Date());}
function addDays(s,n){var p=parts(s);return toStr(new Date(p[0],p[1]-1,p[2]+n));}
function diffDays(a,b){var A=parts(a),B=parts(b);return Math.round((Date.UTC(B[0],B[1]-1,B[2])-Date.UTC(A[0],A[1]-1,A[2]))/864e5);}

function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs){for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='text')el.textContent=v;
    else if(k.indexOf('on')===0)el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?'':v);}}
  for(var i=2;i<arguments.length;i++){
    var kids=[].concat(arguments[i]);
    for(var j=0;j<kids.length;j++){var kid=kids[j];if(kid==null||kid===false)continue;
      el.append(kid.nodeType?kid:document.createTextNode(String(kid)));}
  }
  return el;
}

function safeUrl(u){
  try{var x=new URL(String(u));if(x.protocol==='http:'||x.protocol==='https:')return x.href;}catch(e){}
  return null;
}
function normalizeLink(s){
  s=String(s||'').trim();if(!s)return null;
  if(!/^https?:\/\//i.test(s))s='https://'+s;
  var u=safeUrl(s);if(!u)return null;
  try{if(new URL(u).hostname.indexOf('.')<0)return null;}catch(e){return null;}
  return u;
}

/* ---------- state ---------- */
var storageOk=true,warnNoStore=false;
function fresh(){
  var l=(navigator.language||'ru').slice(0,2);
  return {v:1,lang:l==='uk'?'uk':(l==='en'?'en':'ru'),currency:'UAH',defStart:1000,defStep:1000,run:null,runs:[],days:{},best:{amount:0,days:0},notice:null};
}
function num(x,def){x=+x;return isFinite(x)&&x>0?Math.round(x):def;}
function sanitize(d){
  if(!d||typeof d!=='object')throw new Error('bad');
  var s=fresh();
  if(LANGS.indexOf(d.lang)>=0)s.lang=d.lang;
  if(CURRENCIES.indexOf(d.currency)>=0)s.currency=d.currency;
  s.defStart=num(d.defStart,1000);s.defStep=num(d.defStep,1000);
  if(d.run&&DATE_RE.test(d.run.startDate))s.run={id:num(d.run.id,Date.now()),startDate:d.run.startDate,start:num(d.run.start,s.defStart),step:num(d.run.step,s.defStep)};
  (Array.isArray(d.runs)?d.runs:[]).slice(0,100).forEach(function(r){
    if(r&&DATE_RE.test(r.startDate)&&DATE_RE.test(r.missedDate))s.runs.push({id:num(r.id,0),startDate:r.startDate,missedDate:r.missedDate,days:Math.max(0,Math.round(+r.days||0)),maxAmount:Math.max(0,Math.round(+r.maxAmount||0))});
  });
  var days=d.days&&typeof d.days==='object'?d.days:{};
  Object.keys(days).forEach(function(k){
    if(!DATE_RE.test(k))return;
    var r=days[k]||{};var rec={entries:[],ceiling:!!r.ceiling};
    if(num(r.amount,0))rec.amount=num(r.amount,0);
    (Array.isArray(r.entries)?r.entries:[]).slice(0,60).forEach(function(e){
      if(!e||!num(e.amount,0))return;
      var imgs=(Array.isArray(e.imgs)?e.imgs:[]).filter(function(x){return typeof x==='string'&&/^data:image\/(jpeg|png);base64,/.test(x);}).slice(0,4);
      var links=(Array.isArray(e.links)?e.links:[]).map(safeUrl).filter(Boolean).slice(0,10);
      var mood=MOODS.some(function(m){return m[0]===e.mood;})?e.mood:'ok';
      rec.entries.push({id:num(e.id,Date.now()+rec.entries.length),what:String(e.what||'').slice(0,120),desc:String(e.desc||'').slice(0,1500),amount:num(e.amount,1),mood:mood,imgs:imgs,links:links});
    });
    s.days[k]=rec;
  });
  s.best={amount:num(d.best&&d.best.amount,0),days:num(d.best&&d.best.days,0)};
  return s;
}
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw)return sanitize(JSON.parse(raw));}
  catch(e){if(!(e instanceof SyntaxError)&&!(e&&e.message==='bad')){storageOk=false;warnNoStore=true;}}
  return fresh();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));return true;}
  catch(e){
    var q=e&&(e.name==='QuotaExceededError'||e.name==='NS_ERROR_DOM_QUOTA_REACHED'||e.code===22);
    if(q)return false;
    if(storageOk){storageOk=false;warnNoStore=true;}
    return true;
  }
}

  var s=(I18N[state.lang]&&I18N[state.lang][k])||I18N.ru[k]||k;
  if(v)for(var x in v)s=s.split('{'+x+'}').join(v[x]);
  return s;
}
function fill(s,v){if(v)for(var x in v)s=s.split('{'+x+'}').join(v[x]);return s;}
function pick(k,v){var a=PH[state.lang][k];return fill(a[Math.floor(Math.random()*a.length)],v);}
function loc(){return LOCALES[state.lang]||'ru-RU';}
function money(n){

  catch(e){return n+' '+state.currency;}
}
function dateLabel(date,opts){var p=parts(date);return new Intl.DateTimeFormat(loc(),opts||{weekday:'long',day:'numeric',month:'long'}).format(new Date(p[0],p[1]-1,p[2]));}

/* ---------- game logic ---------- */
function newRun(date){return {id:Date.now(),startDate:date,start:state.defStart,step:state.defStep};}
function ensureDay(date){return state.days[date]||(state.days[date]={entries:[],ceiling:false});}
function spentOn(date){var r=state.days[date];if(!r)return 0;return r.entries.reduce(function(a,e){return a+e.amount;},0);}
function amountFor(run,date){
  var n=diffDays(run.startDate,date),amt=run.start;
  for(var i=0;i<n;i++){var d=state.days[addDays(run.startDate,i)];if(!(d&&d.ceiling))amt+=run.step;}
  return amt;
}
function isDone(run,date){return spentOn(date)>=amountFor(run,date);}
function stats(){
  var run=state.run;if(!run)return {dayNo:0,streak:0,curMax:0,done:false};
  var today=localDate(),idx=Math.max(0,diffDays(run.startDate,today)),done=isDone(run,today);
  return {dayNo:idx+1,streak:idx+(done?1:0),curMax:done?amountFor(run,today):(idx>0?amountFor(run,addDays(today,-1)):0),done:done};
}
function bestAmount(){return Math.max(state.best.amount,stats().curMax);}
function bestDays(){return Math.max(state.best.days,stats().streak);}
function evaluate(){
  var run=state.run;if(!run)return;
  var today=localDate(),n=diffDays(run.startDate,today);
  for(var i=0;i<n;i++){
    var d=addDays(run.startDate,i);
    if(!isDone(run,d)){
      var maxAmt=i>0?amountFor(run,addDays(run.startDate,i-1)):0;
      state.runs.unshift({id:run.id,startDate:run.startDate,missedDate:d,days:i,maxAmount:maxAmt});
      state.runs=state.runs.slice(0,100);
      state.best.amount=Math.max(state.best.amount,maxAmt);
      state.best.days=Math.max(state.best.days,i);
      state.notice={n:i+1,amount:amountFor(run,d)};
      state.run=newRun(today);
      msgOverride=null;flash=null;
      save();return;
    }
  }
}
function todayInfo(){
  var run=state.run,today=localDate();
  var amt=amountFor(run,today),spent=spentOn(today),rec=state.days[today]||{entries:[],ceiling:false};
  return {today:today,amt:amt,spent:spent,left:Math.max(0,amt-spent),done:spent>=amt,rec:rec};
}

/* ---------- mascot ---------- */
function mascotState(info){
  if(flash)return flash;
  if(state.notice)return 'sad';
  if(info.done)return 'party';
  var hr=new Date().getHours();
  if(info.spent===0&&(hr<6||hr>=23))return 'sleepy';
  return 'idle';
}
function mascotMsg(info,st){
  if(msgOverride)return msgOverride;
  var hr=new Date().getHours();
  var key=[localDate(),info.spent,info.amt,st,state.notice?1:0,state.lang].join('|');
  if(msgCache.key===key)return msgCache.msg;
  var m;
  var nextA=amountFor(state.run,addDays(info.today,1));
  if(state.notice)m=pick('reset');
  else if(info.done)m=pick('done',{n:money(nextA)});
  else if(info.spent===0&&(hr<6||hr>=23))m=pick('night');
  else if(info.spent>0)m=pick('going',{r:money(info.left),s:money(info.spent)});
  else m=pick('hello',{a:money(info.amt)});
  msgCache={key:key,msg:m};return m;
}

function countTo(el,from,to){
  if(reduce||from===to||!el.isConnected){el.textContent=money(to);shownAmount=to;return;}
  var t0=performance.now(),dur=700;
  function step(now){
    if(!el.isConnected){shownAmount=to;return;}
    var k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);
    el.textContent=money(Math.round(from+(to-from)*e));
    if(k<1)requestAnimationFrame(step);else shownAmount=to;
  }
  requestAnimationFrame(step);
}

/* ---------- photos ---------- */
function fileToDataUrl(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=rej;
    fr.onload=function(){
      var img=new Image();
      img.onerror=rej;
      img.onload=function(){
        var max=900,w=img.naturalWidth,hh=img.naturalHeight,k=Math.min(1,max/Math.max(w,hh));
        w=Math.max(1,Math.round(w*k));hh=Math.max(1,Math.round(hh*k));
        var c=document.createElement('canvas');c.width=w;c.height=hh;
        var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,hh);ctx.drawImage(img,0,0,w,hh);
        res(c.toDataURL('image/jpeg',0.72));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

    var fr=new FileReader();fr.onload=function(){doImport(String(fr.result));};fr.onerror=function(){toast(t('import_err'));};fr.readAsText(f);
  });
  wrap.append(h('section',{class:'card'},h('h2',{text:t('import_title')}),imp,
    h('div',{class:'row'},h('button',{class:'btn small',type:'button',onclick:function(){doImport(imp.value);}},t('import_btn')),
      h('button',{class:'btn ghost small',type:'button',onclick:function(){impFile.click();}},t('import_file'))),impFile));

  wrap.append(h('section',{class:'card'},
    wipeAsk?[h('p',{text:t('wipe_sure')}),h('div',{class:'row'},
      h('button',{class:'btn danger small',type:'button',onclick:function(){
        var keep={lang:state.lang,currency:state.currency};state=fresh();state.lang=keep.lang;state.currency=keep.currency;
        wipeAsk=false;showBackup=false;calMonth=null;msgOverride=null;msgCache.key='';shownAmount=0;save();render();toast(t('wiped'));
      }},t('wipe_yes')),
      h('button',{class:'btn ghost small',type:'button',onclick:function(){wipeAsk=false;render();}},t('wipe_no')))]
    :h('button',{class:'btn ghost small',type:'button',onclick:function(){wipeAsk=true;render();}},t('wipe'))));
  return wrap;
}

/* ---------- shell ---------- */
var ICONS={
  today:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a2 2 0 010 4h-3a2 2 0 000 4h4"/></svg>',
  diary:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h11a2 2 0 012 2v16H8a2 2 0 01-2-2z"/><path d="M10 8h6M10 12h6"/></svg>',
  streak:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>',
  settings:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="2" fill="var(--surface)"/><circle cx="15" cy="12" r="2" fill="var(--surface)"/><circle cx="8" cy="17" r="2" fill="var(--surface)"/></svg>'
};
function headerEl(){
  var chips=[];
  if(state.run){var s=stats();chips.push(h('span',{class:'chip',text:t('day_n',{n:s.dayNo})}),h('span',{class:'chip alt',text:t('streak_n',{n:s.streak})}));}
  return h('div',{class:'top'},h('h1',{text:t('app_title')}),h('div',{class:'chips'},chips));
}
function renderNav(){
  var box=$('#nav div');box.replaceChildren();
  [['today','tab_today'],['diary','tab_diary'],['streak','tab_streak'],['settings','tab_settings']].forEach(function(x){
    var b=h('button',{type:'button','aria-current':tab===x[0]?'page':null,onclick:function(){
      if(tab===x[0])return;tab=x[0];render();window.scrollTo(0,0);
    }});
    b.innerHTML=ICONS[x[0]];b.append(t(x[1]));box.append(b);
  });
}
function render(){
  document.documentElement.lang=state.lang;
  $('#top').replaceChildren(headerEl());
  var v=tab==='today'?viewToday():tab==='diary'?viewDiary():tab==='streak'?viewStreak():viewSettings();
  $('#view').replaceChildren(v);
  renderNav();
  var a=$('#amount');
  if(a&&a.dataset.to)countTo(a,shownAmount,Number(a.dataset.to));
  if(warnNoStore){warnNoStore=false;toast(t('err_nostore'));}
}
function dayCheck(){
  var d=localDate();
  if(d!==lastDate){lastDate=d;calMonth=null;msgOverride=null;msgCache.key='';evaluate();render();}
}

$('#lb-close').addEventListener('click',closeLightbox);
$('#lightbox').addEventListener('click',function(e){if(e.target===this)closeLightbox();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#lightbox').hidden)closeLightbox();});
document.addEventListener('visibilitychange',function(){if(!document.hidden)dayCheck();});
setInterval(dayCheck,30000);

evaluate();
render();
})();
</script>
